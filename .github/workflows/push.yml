name: 资治通鉴每日推送

on:
  schedule:
    - cron: '0 0 * * *'    # 08:00 北京时间 → 晨读
    - cron: '0 4 * * *'    # 12:00 北京时间 → 午思
    - cron: '0 12 * * *'   # 20:00 北京时间 → 夜悟
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-to-dingtalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 发送钉钉推送
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python scripts/deep_read_content.py --validate
          python push.py

      # 进度提交回仓库：既是断点续推的存档，也让仓库保持活跃，
      # 避免 GitHub「60 天无提交自动停用 schedule」（2026-05-10 停摆的根因）
      - name: 提交进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if ! git diff --cached --quiet; then
            NUM=$(python -c "import json;print(json.load(open('progress.json'))['last'])")
            git commit -m "progress: 第${NUM}篇已推送"
            git push
          fi
