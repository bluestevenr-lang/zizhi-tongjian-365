name: 资治通鉴每日推送

on:
  schedule:
    - cron: '0 0 * * *'    # 08:00 北京时间 → 晨读
    - cron: '0 4 * * *'    # 12:00 北京时间 → 午思
    - cron: '0 12 * * *'   # 20:00 北京时间 → 夜悟
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只校验内容，不发送钉钉、不推进进度"
        required: true
        type: boolean
        default: true

      republish_last:
        description: "重发最近一篇已确认内容，不推进阅读进度"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zizhi-daily-push
  cancel-in-progress: false

jobs:
  push-to-dingtalk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: 校验深读内容
        run: |
          python scripts/deep_read_content.py --validate
          python -m unittest discover -s tests

      - name: 发送钉钉推送
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          REPUBLISH_LAST: ${{ github.event_name == 'workflow_dispatch' && inputs.republish_last }}
        run: |
          if [ "$REPUBLISH_LAST" = "true" ]; then
            python push.py --republish-last
          else
            python push.py
          fi

      # 进度提交回仓库：既是断点续推的存档，也让仓库保持活跃，
      # 避免 GitHub「60 天无提交自动停用 schedule」（2026-05-10 停摆的根因）
      - name: 提交进度
        if: github.event_name == 'schedule' || (inputs.dry_run == false && !inputs.republish_last)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if ! git diff --cached --quiet; then
            NUM=$(python -c "import json;print(json.load(open('progress.json'))['last'])")
            git commit -m "progress: 第${NUM}篇已推送"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase
            done
            exit 1
          fi
